<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 510" width="1050" height="510">
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#90A4AE"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8E24AA"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ACC1"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F9A825"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E53935"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="525" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">Orquestrador de Pedidos</text>

  <!-- Pipeline label -->
  <text x="370" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#999">NestJS Request Pipeline</text>

  <!-- Cliente -->
  <rect x="20" y="90" width="100" height="50" rx="10" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5"/>
  <text x="70" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#37474F">Cliente</text>

  <!-- Guard -->
  <rect x="160" y="80" width="120" height="60" rx="9" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.5"/>
  <text x="220" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#E65100">Guard</text>
  <text x="220" y="123" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#E65100">Bearer Token</text>

  <!-- Interceptor -->
  <rect x="320" y="80" width="130" height="60" rx="9" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="385" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6A1B9A">Interceptor</text>
  <text x="385" y="123" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6A1B9A">Idempotência</text>

  <!-- Webhook -->
  <rect x="490" y="80" width="150" height="60" rx="9" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="565" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2E7D32">Webhook</text>
  <text x="565" y="123" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32">Validação + Enfileirar</text>

  <!-- Redis -->
  <rect x="390" y="230" width="160" height="60" rx="9" fill="#FFEBEE" stroke="#D32F2F" stroke-width="1.5"/>
  <text x="470" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#C62828">Redis</text>
  <text x="470" y="273" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#C62828">BullMQ + Idempotência</text>

  <!-- Enrichment -->
  <rect x="650" y="230" width="160" height="60" rx="9" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="730" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565C0">Enrichment</text>
  <text x="730" y="273" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1565C0">Processa + Orquestra</text>

  <!-- PostgreSQL (cylinder) -->
  <path d="M410,370 a60,8 0 0,1 120,0 v50 a60,8 0 0,1 -120,0 z" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
  <ellipse cx="470" cy="370" rx="60" ry="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
  <text x="470" y="402" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#283593">PostgreSQL</text>

  <!-- Orders API -->
  <rect x="200" y="375" width="130" height="50" rx="9" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
  <text x="265" y="405" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#283593">Orders API</text>

  <!-- ViaCEP API -->
  <rect x="650" y="380" width="150" height="50" rx="9" fill="#E0F7FA" stroke="#00ACC1" stroke-width="1.5"/>
  <text x="725" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#00838F">ViaCEP API</text>

  <!-- ExchangeRate API -->
  <rect x="840" y="380" width="160" height="50" rx="9" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="920" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#F57F17">ExchangeRate API</text>

  <!-- DLQ -->
  <rect x="870" y="230" width="100" height="60" rx="9" fill="#FCE4EC" stroke="#E53935" stroke-width="1.5"/>
  <text x="920" y="265" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#C62828">DLQ</text>

  <!-- Arrow: Cliente → Guard -->
  <line x1="120" y1="115" x2="158" y2="110" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="139" y="103" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#B0BEC5">POST</text>

  <!-- Arrow: Guard → Interceptor -->
  <line x1="280" y1="110" x2="318" y2="110" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Arrow: Interceptor → Webhook -->
  <line x1="450" y1="110" x2="488" y2="110" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Arrow: Interceptor → Redis (idempotency SET NX) -->
  <polyline points="385,140 385,180 450,180 450,228" fill="none" stroke="#8E24AA" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-purple)"/>
  <text x="435" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8E24AA">SET NX</text>

  <!-- Arrow: Webhook → Redis (enqueue) -->
  <polyline points="565,140 565,180 500,180 500,228" fill="none" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="548" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4CAF50">enqueue</text>

  <!-- Arrow: Redis → Enrichment -->
  <line x1="550" y1="260" x2="648" y2="260" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="599" y="253" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#B0BEC5">process</text>

  <!-- Arrow: Enrichment → PostgreSQL -->
  <polyline points="700,290 700,340 532,340 532,375" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="625" y="335" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#B0BEC5">persist</text>

  <!-- Arrow: Orders API → PostgreSQL -->
  <line x1="330" y1="400" x2="408" y2="395" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Arrow: Enrichment → ViaCEP (dashed) -->
  <polyline points="710,290 710,378" fill="none" stroke="#00ACC1" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-teal)"/>

  <!-- Arrow: Enrichment → ExchangeRate (dashed) -->
  <polyline points="760,290 760,350 920,350 920,378" fill="none" stroke="#F9A825" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-yellow)"/>

  <!-- Arrow: Enrichment → DLQ (dashed) -->
  <line x1="810" y1="260" x2="868" y2="260" stroke="#E53935" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="839" y="253" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#E53935">falha</text>

  <!-- Status flow text -->
  <text x="525" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#999">RECEIVED → PROCESSING → ENRICHED | FAILED_ENRICHMENT</text>
</svg>
