<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#90A4AE"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ACC1"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F9A825"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E53935"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">Orquestrador de Pedidos</text>

  <!-- Cliente -->
  <rect x="20" y="95" width="120" height="50" rx="10" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5"/>
  <text x="80" y="125" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#37474F">Cliente</text>

  <!-- Webhook -->
  <rect x="200" y="85" width="160" height="60" rx="9" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="280" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2E7D32">Webhook</text>
  <text x="280" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32">Validação + Idempotência</text>

  <!-- Redis -->
  <rect x="420" y="85" width="140" height="60" rx="9" fill="#FFEBEE" stroke="#D32F2F" stroke-width="1.5"/>
  <text x="490" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#C62828">Redis / BullMQ</text>

  <!-- Enrichment -->
  <rect x="620" y="85" width="160" height="60" rx="9" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="700" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565C0">Enrichment</text>
  <text x="700" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1565C0">Processa + Orquestra</text>

  <!-- PostgreSQL (cylinder) -->
  <path d="M420,250 a70,8 0 0,1 140,0 v50 a70,8 0 0,1 -140,0 z" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
  <ellipse cx="490" cy="250" rx="70" ry="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
  <text x="490" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#283593">PostgreSQL</text>

  <!-- Orders API -->
  <rect x="220" y="255" width="130" height="50" rx="9" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="285" y="285" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6A1B9A">Orders API</text>

  <!-- ViaCEP API -->
  <rect x="320" y="390" width="160" height="50" rx="9" fill="#E0F7FA" stroke="#00ACC1" stroke-width="1.5"/>
  <text x="400" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#00838F">ViaCEP API</text>

  <!-- ExchangeRate API -->
  <rect x="530" y="390" width="160" height="50" rx="9" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="610" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#F57F17">ExchangeRate API</text>

  <!-- DLQ -->
  <rect x="830" y="85" width="100" height="60" rx="9" fill="#FCE4EC" stroke="#E53935" stroke-width="1.5"/>
  <text x="880" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#C62828">DLQ</text>

  <!-- Arrow: Cliente → Webhook -->
  <line x1="140" y1="120" x2="198" y2="115" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="168" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#B0BEC5">POST</text>

  <!-- Arrow: Webhook → Redis -->
  <line x1="360" y1="115" x2="418" y2="115" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="389" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#B0BEC5">enqueue</text>

  <!-- Arrow: Redis → Enrichment -->
  <line x1="560" y1="115" x2="618" y2="115" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="589" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#B0BEC5">process</text>

  <!-- Arrow: Enrichment → PostgreSQL -->
  <polyline points="700,145 700,275 562,275" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Arrow: Orders API → PostgreSQL -->
  <line x1="350" y1="280" x2="418" y2="275" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Arrow: Enrichment → ViaCEP (dashed) -->
  <polyline points="670,145 670,365 400,365 400,388" fill="none" stroke="#00ACC1" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-teal)"/>

  <!-- Arrow: Enrichment → ExchangeRate (dashed) -->
  <polyline points="720,145 720,355 610,355 610,388" fill="none" stroke="#F9A825" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-yellow)"/>

  <!-- Arrow: Enrichment → DLQ (dashed) -->
  <line x1="780" y1="115" x2="828" y2="115" stroke="#E53935" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="804" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#E53935">falha</text>

  <!-- Status flow text -->
  <text x="490" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#999">RECEIVED → PROCESSING → ENRICHED | FAILED</text>
</svg>
